      function startOfDay(dateInput) {
        var d = dateInput ? new Date(dateInput) : new Date();
        if (isNaN(d.getTime())) {
          var now = new Date();
          return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }

      function addDays(baseDate, days) {
        return new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + days);
      }

      // Próximo dia útil (pula sábado e domingo)
      function getNextBusinessDay(dateInput) {
        var d = addDays(startOfDay(dateInput), 1);
        while (d.getDay() === 0 || d.getDay() === 6) {
          d = addDays(d, 1);
        }
        return d;
      }

      function formatShortDate(dateObj) {
        return dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      }

      function cleanTextNoReview(str) {
        return (str || '').replace(/\brevis[aã][oõ]e?s?\b/gi, '').replace(/\s+/g, ' ').trim();
      }

      function buildSummaryWithoutReviewWord(question, correctOpt) {
        var subtheme = (question.subtheme || '').trim();
        var gabaritoText = ((correctOpt && correctOpt.text) || '')
          .replace(/^[A-E]\)\s*/i, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (gabaritoText && subtheme && subtheme.toLowerCase() !== 'geral') {
          var gCurto = gabaritoText.length > 78 ? gabaritoText.slice(0, 78).trim() + '...' : gabaritoText;
          return cleanTextNoReview(subtheme) + ': ' + cleanTextNoReview(gCurto);
        }
        if (gabaritoText) {
          var gCurto2 = gabaritoText.length > 96 ? gabaritoText.slice(0, 96).trim() + '...' : gabaritoText;
          return cleanTextNoReview(gCurto2);
        }
        if (subtheme && subtheme.toLowerCase() !== 'geral') {
          return cleanTextNoReview(subtheme);
        }
        var frase = (question.text || 'Conduta clínica').replace(/^\d+[\)\.\-]\s*/, '').split(/[.?!]\s+/)[0];
        var fCurto = frase.length > 96 ? frase.slice(0, 96).trim() + '...' : frase;
        return cleanTextNoReview(fCurto);
      }

      function buildFullReviewText(question, correctOpt) {
        var subtheme = (question.subtheme || 'Geral').trim();
        var gabaritoText = ((correctOpt && correctOpt.text) || '').replace(/^[A-E]\)\s*/i, '').replace(/\s+/g, ' ').trim();
        var correctLetter = (correctOpt && correctOpt.id) ? ('Alternativa ' + correctOpt.id) : 'Gabarito registrado';
        if (gabaritoText) {
          return subtheme + ' — ' + correctLetter + ': ' + gabaritoText;
        }
        return subtheme + ' — ' + correctLetter;
      }

      function buildUserFromSession(user) {
        if (!user) return null;
        var username =
          (user.user_metadata && user.user_metadata.username) ||
          (user.email ? user.email.split('@')[0] : 'usuario');
        return { id: user.id, username: username };
      }

      function App() {
        var stateUser = useState(function () {
          try {
            var saved = sessionStorage.getItem('medflow_session_user');
            return saved ? JSON.parse(saved) : null;
          } catch (err) { return null; }
        });
        var currentUser = stateUser[0];
        var setCurrentUser = stateUser[1];

        useEffect(function () {
          if (!supabaseClient) return;

          supabaseClient.auth.getSession().then(function (res) {
            var session = res && res.data && res.data.session;
            if (session && session.user) {
              var userObj = buildUserFromSession(session.user);
              sessionStorage.setItem('medflow_session_user', JSON.stringify(userObj));
              setCurrentUser(userObj);
            }
          });

          var authSub = supabaseClient.auth.onAuthStateChange(function (_event, session) {
            if (session && session.user) {
              var userObj = buildUserFromSession(session.user);
              sessionStorage.setItem('medflow_session_user', JSON.stringify(userObj));
              setCurrentUser(userObj);
            } else {
              sessionStorage.removeItem('medflow_session_user');
              setCurrentUser(null);
            }
          });

          return function () {
            if (authSub && authSub.data && authSub.data.subscription) {
              authSub.data.subscription.unsubscribe();
            }
          };
        }, []);

        function handleLogin(user) {
          sessionStorage.setItem('medflow_session_user', JSON.stringify(user));
          setCurrentUser(user);
        }

        function handleLogout() {
          if (supabaseClient) {
            supabaseClient.auth.signOut();
          }
          sessionStorage.removeItem('medflow_session_user');
          setCurrentUser(null);
        }

        if (!currentUser) {
          return e(LoginView, { onLogin: handleLogin });
        }

        return e(MainApp, { currentUser: currentUser, onLogout: handleLogout });
      }

      function LoginView(props) {
        var onLogin = props.onLogin;
        var sReg = useState(false); var isRegistering = sReg[0]; var setIsRegistering = sReg[1];
        var sUser = useState(''); var username = sUser[0]; var setUsername = sUser[1];
        var sPass = useState(''); var password = sPass[0]; var setPassword = sPass[1];
        var sErr = useState(''); var error = sErr[0]; var setError = sErr[1];
        var sLoad = useState(false); var loading = sLoad[0]; var setLoading = sLoad[1];

        function handleSubmit(ev) {
          ev.preventDefault();
          setError('');
          var userTrimmed = username.trim().toLowerCase();
          var passTrimmed = password.trim();

          if (!userTrimmed || !passTrimmed) {
            setError('Preencha todos os campos.');
            return;
          }

          if (!supabaseClient) {
            setError('Erro: Cliente Supabase não inicializado.');
            return;
          }

          setLoading(true);
          var email = userTrimmed.indexOf('@') !== -1 ? userTrimmed : (userTrimmed + '@medflow.app');
          var cleanUsername = email.split('@')[0];

          if (isRegistering) {
            supabaseClient.auth.signUp({
              email: email,
              password: passTrimmed,
              options: { data: { username: cleanUsername } }
            }).then(function (res) {
              setLoading(false);
              if (res.error) {
                setError(res.error.message);
                return;
              }
              if (res.data && res.data.user && res.data.session) {
                onLogin(buildUserFromSession(res.data.user));
                return;
              }
              if (res.data && res.data.user && !res.data.session) {
                setError('Conta criada. Confirme o e-mail ou desative "Confirm email" no painel do Supabase.');
              }
            }).catch(function () {
              setLoading(false);
              setError('Erro ao conectar com o servidor de autenticação.');
            });
          } else {
            supabaseClient.auth.signInWithPassword({
              email: email,
              password: passTrimmed
            }).then(function (res) {
              setLoading(false);
              if (res.error) {
                setError(
                  res.error.message === 'Email not confirmed'
                    ? 'E-mail não confirmado no Supabase.'
                    : 'Usuário ou senha incorretos.'
                );
                return;
              }
              if (res.data && res.data.user) {
                onLogin(buildUserFromSession(res.data.user));
              }
            }).catch(function () {
              setLoading(false);
              setError('Erro ao conectar com o servidor de autenticação.');
            });

                      placeholder: 'Escreva suas anotações...',
                      className: 'w-full min-h-[90px] p-3 text-xs sm:text-sm border border-slate-800 rounded-xl bg-slate-900 text-slate-200 outline-none'
                    }),
                    e('div', { className: 'flex justify-end mt-2' },
                      e('button', {
                        onClick: saveNote,
                        className: 'flex items-center text-xs sm:text-sm font-medium text-blue-400 hover:text-blue-300 py-1 px-2'
                      }, e(Save, { className: 'w-4 h-4 mr-1' }), ' Salvar Anotação')
                    )
                  )
                )
              )
            )
          )
        );
      }

      function UploadView(props) {
        var questions = props.questions;
        var setQuestions = props.setQuestions;
        var simQuestions = props.simQuestions;
        var setSimQuestions = props.setSimQuestions;
        var persistGlobalDb = props.persistGlobalDb;
        var clearData = props.clearData;
        var clearProgress = props.clearProgress;

        var sBulk = useState(''); var bulkText = sBulk[0]; var setBulkText = sBulk[1];
        var sYear = useState('2026'); var examYear = sYear[0]; var setExamYear = sYear[1];
        var sSimName = useState('Simulado Integrado'); var simName = sSimName[0]; var setSimName = sSimName[1];
        var sSimNum = useState('1'); var simNumber = sSimNum[0]; var setSimNumber = sSimNum[1];
        var sErr = useState(''); var errorMsg = sErr[0]; var setErrorMsg = sErr[1];
        var sOk = useState(''); var successMsg = sOk[0]; var setSuccessMsg = sOk[1];
        var sSav = useState(false); var saving = sSav[0]; var setSaving = sSav[1];
        var sDelY = useState('2026'); var deleteYear = sDelY[0]; var setDeleteYear = sDelY[1];
        var sDelA = useState('Todas'); var deleteArea = sDelA[0]; var setDeleteArea = sDelA[1];

        function parseQuestions(text, defaultExam, defaultYear, isSim, groupLabel) {
          var rawLines = text.split('\n');
          var lines = [];
          var currentLine = '';

          for (var i = 0; i < rawLines.length; i++) {
            var line = rawLines[i].trim();
            if (!line) continue;
            if (!currentLine) {
              currentLine = line;
            } else {
              var partsCount = currentLine.split('|').length;
              if (partsCount < 9) {
                currentLine += ' ' + line;
              } else {
                lines.push(currentLine);
                currentLine = line;
              }
            }
          }
          if (currentLine) lines.push(currentLine);

          return lines.map(function (line, index) {
            var parts = line.split('|');
            if (parts.length < 9) {
              throw new Error('A linha ' + (index + 1) + ' não possui as 9 colunas exigidas (separadas por \'|\').');
            }

            var area = parts[0].trim();
            var areaUpper = area.toUpperCase();
            if (areaUpper.indexOf('FAMÍLIA') !== -1 || areaUpper.indexOf('FAMILIA') !== -1 || areaUpper === 'MFC' || areaUpper.indexOf('PREVENTIVA') !== -1) {
              area = 'Medicina da Família e Comunidade';
            } else if (areaUpper.indexOf('CIRURGIA') !== -1) {
              area = 'Cirurgia Geral';
            } else if (areaUpper.indexOf('GINECOLOGIA') !== -1 || areaUpper === 'GO' || areaUpper.indexOf('OBSTETR') !== -1) {
              area = 'Ginecologia & Obstetrícia';
            } else if (areaUpper.indexOf('CLÍNICA') !== -1 || areaUpper.indexOf('CLINICA') !== -1) {
              area = 'Clínica Médica';
            } else if (areaUpper.indexOf('PEDIATRIA') !== -1 || areaUpper === 'PED') {
              area = 'Pediatria';
            }

            var subtheme = parts[1].trim();
            var textContent = parts[2].trim();
            var altA = parts[3].trim();
            var altB = parts[4].trim();
            var altC = parts[5].trim();
            var altD = parts[6].trim();
            var altE = parts[7].trim();

            var gabarito = (parts[8] || '').trim();
            var gabaritoFormatado = gabarito.toUpperCase();
            var isAnnulled = gabaritoFormatado === 'ANULADA' || gabaritoFormatado === 'NULA' || gabaritoFormatado === '-' || gabaritoFormatado === '';

            return {
              id: 'q_' + (isSim ? 'sim' : 'uepa') + '_' + Date.now() + '_' + index,
              exam: defaultExam,
              year: parseInt(defaultYear, 10) || 2026,
              groupLabel: groupLabel || String(defaultYear),
              area: area,
              subtheme: subtheme || 'Geral',
              text: textContent,
              isAnnulled: isAnnulled,
              options: [
                { id: 'A', text: altA, isCorrect: gabaritoFormatado === 'A' },
                { id: 'B', text: altB, isCorrect: gabaritoFormatado === 'B' },
                { id: 'C', text: altC, isCorrect: gabaritoFormatado === 'C' },
                { id: 'D', text: altD, isCorrect: gabaritoFormatado === 'D' },
                { id: 'E', text: altE, isCorrect: gabaritoFormatado === 'E' }
              ]
            };
          });
        }

        function handleImportUepa() {
          setErrorMsg('');
          setSuccessMsg('');
          if (!bulkText.trim()) return;
          setSaving(true);
          try {
            var parsed = parseQuestions(bulkText, 'UEPA', examYear, false, String(examYear));
            var nextQuestions = questions.concat(parsed);
            persistGlobalDb(nextQuestions, simQuestions)
              .then(function () {
                setQuestions(nextQuestions);
                setBulkText('');
                setSuccessMsg(parsed.length + ' questão(ões) salva(s) no banco global (UEPA).');
              })
              .catch(function (err) { setErrorMsg(err.message); })
              .finally(function () { setSaving(false); });
          } catch (err) {
            setErrorMsg(err.message);
            setSaving(false);
          }
        }

        function handleImportSimulado() {
          setErrorMsg('');
          setSuccessMsg('');
          if (!bulkText.trim()) return;
          setSaving(true);
          try {
            var groupLabel = simName + ' #' + simNumber;
            var parsed = parseQuestions(bulkText, simName, new Date().getFullYear(), true, groupLabel);
            var nextSimQuestions = simQuestions.concat(parsed);
            persistGlobalDb(questions, nextSimQuestions)
              .then(function () {
                setSimQuestions(nextSimQuestions);
                setBulkText('');
                setSuccessMsg(parsed.length + ' questão(ões) salva(s) no banco global (Simulados).');
              })
              .catch(function (err) { setErrorMsg(err.message); })
              .finally(function () { setSaving(false); });
          } catch (err) {
            setErrorMsg(err.message);
            setSaving(false);
          }
        }

        function handleFilteredDelete() {
          setErrorMsg('');
          setSuccessMsg('');
          setSaving(true);
          var targetYear = deleteYear.trim();
          var filterFn = function (q) {
            var matchYear = !targetYear || String(q.year) === targetYear || (q.groupLabel && q.groupLabel.indexOf(targetYear) !== -1);
            var matchArea = deleteArea === 'Todas' || q.area === deleteArea;
            return !(matchYear && matchArea);
          };

          var nextQuestions = questions.filter(filterFn);
          var nextSimQuestions = simQuestions.filter(filterFn);
          persistGlobalDb(nextQuestions, nextSimQuestions)
            .then(function () {
              setQuestions(nextQuestions);
              setSimQuestions(nextSimQuestions);
              setSuccessMsg('Filtro aplicado e banco global atualizado.');
            })
            .catch(function (err) { setErrorMsg(err.message); })
            .finally(function () { setSaving(false); });
        }

        return e('div', { className: 'max-w-3xl mx-auto space-y-4 sm:space-y-6' },
          e('div', { className: 'bg-slate-900 p-4 sm:p-8 rounded-2xl border border-slate-800 shadow-xl' },
            e('div', { className: 'flex items-center mb-5 sm:mb-6' },
              e('div', { className: 'bg-indigo-600/20 p-2.5 sm:p-3 rounded-2xl mr-3 sm:mr-4 border border-indigo-500/30 shrink-0' },
                e(Upload, { className: 'w-5 h-5 sm:w-6 sm:h-6 text-indigo-400' })
              ),
              e('div', null,
                e('h2', { className: 'text-xl sm:text-2xl font-bold text-white' }, 'Banco de Dados Base (Global e Aberto)'),
                e('p', { className: 'text-slate-400 text-xs sm:text-sm mt-1' },
                  'Qualquer usuário pode importar questões livremente. Tudo fica salvo imediatamente na nuvem para todos.'
                )
              )
            ),
            e('div', { className: 'bg-slate-950 border border-slate-800 rounded-xl p-4 sm:p-6 mb-5 sm:mb-6' },
              e('p', { className: 'text-xs sm:text-sm font-medium text-slate-300 mb-2' }, 'Padrão Obrigatório (9 Colunas separadas por Pipe |):'),
              e('code', { className: 'block bg-slate-900 p-3 rounded-lg text-slate-300 text-[11px] sm:text-xs font-mono overflow-x-auto border border-slate-800' },
                'Área | Subtema | Enunciado da questão | Alt A | Alt B | Alt C | Alt D | Alt E | Gabarito (A/B/C/D/E ou Anulada)'
              )
            ),
            e('textarea', {
              className: 'w-full h-44 sm:h-52 p-3.5 sm:p-4 border border-slate-800 rounded-xl font-mono text-xs sm:text-sm bg-slate-950 text-slate-200 outline-none mb-5 sm:mb-6 resize-y',
              placeholder: 'Cole as questões usando | como separador...',
              value: bulkText,
              onChange: function (ev) { setBulkText(ev.target.value); }
            }),
            errorMsg ? e('div', { className: 'mb-5 sm:mb-6 p-3 bg-red-950/60 border border-red-900 text-red-300 text-xs sm:text-sm rounded-xl flex items-center' },
              e(AlertCircle, { className: 'w-4 h-4 mr-2 shrink-0' }), ' ', errorMsg
            ) : null,
            successMsg ? e('div', { className: 'mb-5 sm:mb-6 p-3 bg-emerald-950/60 border border-emerald-900 text-emerald-300 text-xs sm:text-sm rounded-xl flex items-center' },
              e(Check, { className: 'w-4 h-4 mr-2 shrink-0' }), ' ', successMsg
            ) : null,
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 pt-4 border-t border-slate-800' },
              e('div', { className: 'bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex flex-col justify-between' },
                e('div', null,
                  e('h3', { className: 'font-bold text-white mb-3 flex items-center text-xs sm:text-sm' },
                    e(Archive, { className: 'w-4 h-4 mr-2 text-blue-400' }), ' Destino: UEPA PROVAS (Base)'
                  ),
                  e('div', { className: 'mb-4' },
                    e('label', { className: 'block text-xs font-medium text-slate-400 mb-1' }, 'Ano da Prova UEPA'),
                    e('input', {
                      type: 'number',
                      value: examYear,
                      onChange: function (ev) { setExamYear(ev.target.value); },
                      className: 'w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none'
                    })
                  )
                ),
                e('button', {
                  disabled: saving,
                  onClick: handleImportUepa,
                  className: 'w-full bg-blue-600 text-white font-bold py-2.5 min-h-[42px] rounded-xl hover:bg-blue-500 text-xs sm:text-sm disabled:opacity-50'
                }, saving ? 'Salvando...' : 'Importar para Banco Base UEPA')
              ),
              e('div', { className: 'bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex flex-col justify-between' },
                e('div', null,
                  e('h3', { className: 'font-bold text-white mb-3 flex items-center text-xs sm:text-sm' },
                    e(BookOpen, { className: 'w-4 h-4 mr-2 text-indigo-400' }), ' Destino: Simulados (Base)'
                  ),
                  e('div', { className: 'grid grid-cols-2 gap-2 mb-4' },
                    e('div', null,
                      e('label', { className: 'block text-xs font-medium text-slate-400 mb-1' }, 'Nome'),
                      e('input', {
                        type: 'text',
                        value: simName,
                        onChange: function (ev) { setSimName(ev.target.value); },
                        className: 'w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none'
                      })
                    ),
                    e('div', null,
                      e('label', { className: 'block text-xs font-medium text-slate-400 mb-1' }, 'Número'),
                      e('input', {
                        type: 'text',
                        value: simNumber,
                        onChange: function (ev) { setSimNumber(ev.target.value); },
                        className: 'w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none'
                      })
                    )
                  )
                ),
                e('button', {
                  disabled: saving,
                  onClick: handleImportSimulado,
                  className: 'w-full bg-indigo-600 text-white font-bold py-2.5 min-h-[42px] rounded-xl hover:bg-indigo-500 text-xs sm:text-sm disabled:opacity-50'
                }, saving ? 'Salvando...' : 'Importar para Banco Base Simulados')
              )
            )
          ),

          e('div', { className: 'bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl mt-6 sm:mt-8' },
            e('h3', { className: 'text-base sm:text-lg font-bold text-slate-200 mb-2' }, 'Exclusão de Questões do Banco Base'),
            e('p', { className: 'text-slate-400 text-xs sm:text-sm mb-5 sm:mb-6' },
              'Selecione o ano e a grande área desejada para remover itens do banco global compartilhado.'
            ),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mb-5 sm:mb-6' },
              e('div', null,
                e('label', { className: 'block text-xs font-medium text-slate-400 mb-1.5' }, 'Ano / Prova (Ex: 2026)'),
                e('input', {
                  type: 'text',
                  value: deleteYear,
                  onChange: function (ev) { setDeleteYear(ev.target.value); },
                  className: 'w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none'
                })
              ),
              e('div', null,
                e('label', { className: 'block text-xs font-medium text-slate-400 mb-1.5' }, 'Grande Área'),
                e('select', {
                  value: deleteArea,
                  onChange: function (ev) { setDeleteArea(ev.target.value); },
                  className: 'w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none'
                },
                  [e('option', { key: 'Todas', value: 'Todas' }, 'Todas as Grandes Áreas')].concat(
                    AREAS.map(function (a) { return e('option', { key: a, value: a }, a); })
                  )
                )
              )
            ),
            e('div', { className: 'mb-5 sm:mb-6' },
              e('button', {
                disabled: saving,
                onClick: handleFilteredDelete,
                className: 'w-full bg-rose-600 text-white font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/30 text-xs sm:text-sm disabled:opacity-50'
              }, 'Apagar Questões do Banco Base Correspondentes aos Filtros')
            ),
            e('div', { className: 'flex flex-col sm:flex-row gap-3 sm:gap-4 pt-4 border-t border-slate-800' },
              e('button', {
                onClick: clearProgress,
                className: 'flex-1 bg-slate-800 border border-slate-700 text-red-400 font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-slate-700 text-xs sm:text-sm'
              }, 'Zerar Meu Progresso Pessoal'),
              e('button', {
                onClick: clearData,
                className: 'flex-1 bg-red-600 text-white font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-red-500 text-xs sm:text-sm shadow-lg shadow-red-900/30'
              }, 'Apagar Todo o Banco Global')
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
