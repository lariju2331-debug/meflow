  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    
    // Configuração Supabase
    const SUPABASE_URL = 'https://naoaeuqotcjzxagllkiz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9KR6IDS7LL12evXMX0cHXw_HojK1e7z';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const RechartsLib = window.Recharts || {};

    const Check = props => <IconSvg {...props}><polyline points="20 6 9 17 4 12" /></IconSvg>;
    const X = props => <IconSvg {...props}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconSvg>;

    const ChevronRight = props => <IconSvg {...props}><polyline points="9 18 15 12 9 6" /></IconSvg>;

    const AlertCircle = props => (

    const Save = props => (

    const Upload = props => (

        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </IconSvg>
    );
    const BarChart3 = props => (
      <IconSvg {...props}>
        <path d="M3 3v18h18" />
        <path d="M18 17V9" />
        <path d="M13 17V5" />
        <path d="M8 17v-3" />
      </IconSvg>
    );
    const Target = props => (
      <IconSvg {...props}>
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="12" r="6" />
        <circle cx="12" cy="12" r="2" />

    );
    const BookOpen = props => (
      <IconSvg {...props}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
      </IconSvg>
    );
    const FileText = props => (
      <IconSvg {...props}>
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
        <polyline points="10 9 9 9 8 9" />
      </IconSvg>
    );
    const Activity = props => (
      <IconSvg {...props}>
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
      </IconSvg>
    );
    const Stethoscope = props => (
      <IconSvg {...props}>
        <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
        <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
        <circle cx="20" cy="10" r="2" />
      </IconSvg>
    );
    const Baby = props => (
      <IconSvg {...props}>
        <path d="M9 12h.01" />
        <path d="M15 12h.01" />
        <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5" />
        <path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1" />
      </IconSvg>
    );
    const Users = props => (
      <IconSvg {...props}>
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </IconSvg>
    );
    const HeartPulse = props => (
      <IconSvg {...props}>
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" />
      </IconSvg>
    );
    const Archive = props => (
      <IconSvg {...props}>
        <polyline points="21 8 21 21 3 21 3 8" />
        <rect x="1" y="3" width="22" height="5" />
        <line x1="10" y1="12" x2="14" y2="12" />
      </IconSvg>
    );
    const LogOut = props => (
      <IconSvg {...props}>
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </IconSvg>
    );
    const Cloud = props => (
      <IconSvg {...props}>
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
      </IconSvg>
    );

    const AREAS = [
      'Medicina da Família e Comunidade', 
      'Clínica Médica', 
      'Cirurgia Geral', 
      'Ginecologia & Obstetrícia', 
      'Pediatria'
    ];

    const AREA_COLORS = {
      'Medicina da Família e Comunidade': '#fbbf24', 
      'Clínica Médica': '#60a5fa', 
      'Cirurgia Geral': '#f87171', 
      'Ginecologia & Obstetrícia': '#a78bfa', 
      'Pediatria': '#34d399', 
      'Geral': '#94a3b8' 
    };

    const getAreaColor = (area) => AREA_COLORS[area] || AREA_COLORS['Geral'];

    function buildUserFromSession(user) {
      if (!user) return null;
      const username =
        user.user_metadata?.username ||
        (user.email ? user.email.split('@')[0] : 'usuario');
      return { id: user.id, username };
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = sessionStorage.getItem('medflow_session_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      useEffect(() => {
        if (!supabaseClient) return;

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            const userObj = buildUserFromSession(session.user);
            sessionStorage.setItem('medflow_session_user', JSON.stringify(userObj));
            setCurrentUser(userObj);
          }
        });

        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            const userObj = buildUserFromSession(session.user);
            sessionStorage.setItem('medflow_session_user', JSON.stringify(userObj));
            setCurrentUser(userObj);
          } else {
            sessionStorage.removeItem('medflow_session_user');
            setCurrentUser(null);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleLogin = (user) => {
        sessionStorage.setItem('medflow_session_user', JSON.stringify(user));
        setCurrentUser(user);
      };

      const handleLogout = async () => {
        if (supabaseClient) {
          await supabaseClient.auth.signOut();
        }
        sessionStorage.removeItem('medflow_session_user');
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <LoginView onLogin={handleLogin} />;
      }

      return <MainApp currentUser={currentUser} onLogout={handleLogout} />;
    }

    function LoginView({ onLogin }) {
      const [isRegistering, setIsRegistering] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        const userTrimmed = username.trim().toLowerCase();
        const passTrimmed = password.trim();

        if (!userTrimmed || !passTrimmed) {
          setError('Preencha todos os campos.');
          return;
        }

        if (!supabaseClient) {
          setError('Erro: Cliente Supabase não inicializado.');
          return;
        }

        setLoading(true);
        try {
          const email = userTrimmed.includes('@') ? userTrimmed : `${userTrimmed}@medflow.app`;
          const cleanUsername = email.split('@')[0];

          if (isRegistering) {
            const { data, error: signUpError } = await supabaseClient.auth.signUp({
              email,
              password: passTrimmed,
              options: { data: { username: cleanUsername } }
            });

            if (signUpError) {
              setError(signUpError.message);
              setLoading(false);
              return;
            }

            if (data?.user && data?.session) {
              onLogin(buildUserFromSession(data.user));
              return;
            }

            if (data?.user && !data?.session) {
              setError('Conta criada. Confirme o e-mail ou desative "Confirm email" em Authentication > Providers > Email no Supabase.');
              setLoading(false);
              return;
            }
          } else {
            const { data, error: signInError } = await supabaseClient.auth.signInWithPassword({
              email,
              password: passTrimmed
            });

            if (signInError) {
              setError(
                signInError.message === 'Email not confirmed'
                  ? 'E-mail não confirmado no Supabase.'
                  : 'Usuário ou senha incorretos.'
              );
              setLoading(false);
              return;
            }

            if (data?.user) {
              onLogin(buildUserFromSession(data.user));
              return;
            }
          }
        } catch (err) {
          setError('Erro ao conectar com o servidor de autenticação.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 sm:p-6">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl shadow-2xl p-6 sm:p-8">
            <div className="flex flex-col items-center mb-6 sm:mb-8">
              <div className="bg-blue-600 p-3.5 sm:p-4 rounded-2xl shadow-lg shadow-blue-900/40 mb-4">
                <Activity className="w-7 h-7 sm:w-8 sm:h-8 text-white" />
              </div>
              <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">Med<span className="text-blue-400">Flow</span></h1>
              <p className="text-slate-400 text-xs sm:text-sm mt-2 text-center">Banco Base Global & Progresso Individual em Nuvem</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 sm:space-y-5">
              {error && (
                <div className="p-3 bg-red-950/60 border border-red-900 text-red-300 text-xs sm:text-sm rounded-xl flex items-center">
                  <AlertCircle className="w-4 h-4 mr-2 shrink-0" />
                  <span>{error}</span>
                </div>
              )}
              
              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5 ml-1">Usuário ou E-mail</label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full pl-4 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm sm:text-base"
                  placeholder="Ex: junior ou junior@medflow.app"
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5 ml-1">Senha</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full pl-4 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm sm:text-base"
                  placeholder="Sua senha"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition-colors shadow-lg shadow-blue-900/30 disabled:opacity-50 min-h-[44px]"
              >
                {loading ? 'Carregando dados...' : (isRegistering ? 'Criar Conta e Entrar' : 'Entrar na Plataforma')}
              </button>
            </form>

            <div className="mt-6 text-center">
              <button
                type="button"
                onClick={() => { setIsRegistering(!isRegistering); setError(''); }}
                className="text-slate-400 hover:text-blue-400 text-xs sm:text-sm font-medium py-1 px-2"
              >
                {isRegistering ? 'Já tem uma conta? Faça login' : 'Não tem conta? Cadastre-se'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function MainApp({ currentUser, onLogout }) {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Conectando ao Banco Global...');
      const canAutoSaveGlobal = useRef(false);
      const canAutoSaveUser = useRef(false);
      
      const [questions, setQuestions] = useState([]);
      const [simQuestions, setSimQuestions] = useState([]);
      const [progress, setProgress] = useState({});
      const [notes, setNotes] = useState({});

      const persistGlobalDb = async (nextQuestions, nextSimQuestions) => {
        if (!supabaseClient) {
          throw new Error('Cliente Supabase não inicializado.');
        }
        setSyncStatus('Salvando no Banco Global...');
        const { error } = await supabaseClient
          .from('medflow_cloud_storage')
          .upsert([
            {
              key: 'global_db',
              value: { questions: nextQuestions, simQuestions: nextSimQuestions },
              updated_at: new Date().toISOString()
            }
          ], { onConflict: 'key' });

        if (error) {
          setSyncStatus(`Erro Global: ${error.message}`);
          throw new Error(`Falha ao salvar no banco global: ${error.message}`);
        }
        setSyncStatus('Banco Global Ativo');
      };

      const persistUserStorage = async (nextProgress, nextNotes) => {
        if (!supabaseClient) return;
        setSyncStatus('Salvando Progresso...');
        const { error } = await supabaseClient
          .from('medflow_cloud_storage')
          .upsert([
            {
              key: `user_global_${currentUser.username}`,
              value: { progress: nextProgress, notes: nextNotes },
              updated_at: new Date().toISOString()
            }
          ], { onConflict: 'key' });

        if (error) {
          console.error('Erro ao salvar progresso:', error.message);
          setSyncStatus(`Erro Progresso: ${error.message}`);
        } else {
          setSyncStatus('Banco Global Ativo');
        }
      };

      useEffect(() => {
        let active = true;
        canAutoSaveGlobal.current = false;
        canAutoSaveUser.current = false;

        async function loadCloudData() {
          if (!supabaseClient) {
            setSyncStatus('Erro de Conexão Cloud');
            setIsDataLoaded(true);
            return;
          }
          try {
            const { data: cloudData, error: globalErr } = await supabaseClient
              .from('medflow_cloud_storage')
              .select('*')
              .eq('key', 'global_db')
              .maybeSingle();

            if (!active) return;

            if (globalErr) {
              console.error('Erro ao ler global_db:', globalErr.message);
              setSyncStatus(`Erro Leitura: ${globalErr.message}`);
            } else {
              if (cloudData && cloudData.value) {
                setQuestions(Array.isArray(cloudData.value.questions) ? cloudData.value.questions : []);
                setSimQuestions(Array.isArray(cloudData.value.simQuestions) ? cloudData.value.simQuestions : []);
              }
              canAutoSaveGlobal.current = true;
              setSyncStatus('Banco Global Ativo');
            }

            const { data: userCloud, error: userErr } = await supabaseClient
              .from('medflow_cloud_storage')
              .select('*')
              .eq('key', `user_global_${currentUser.username}`)
              .maybeSingle();

            if (!active) return;

            if (userErr) {
              console.error('Erro ao ler progresso do usuário:', userErr.message);
            } else {
              if (userCloud && userCloud.value) {
                setProgress(userCloud.value.progress && typeof userCloud.value.progress === 'object' ? userCloud.value.progress : {});
                setNotes(userCloud.value.notes && typeof userCloud.value.notes === 'object' ? userCloud.value.notes : {});
              }
              canAutoSaveUser.current = true;
            }
          } catch (e) {
            console.error("Erro ao carregar dados globais", e);
            if (active) setSyncStatus('Erro ao Sincronizar');
          } finally {
            if (active) setIsDataLoaded(true);
          }
        }
        loadCloudData();
        return () => { active = false; };
      }, [currentUser.username]);

      const isFirstGlobalRender = useRef(true);
      useEffect(() => {
        if (!isDataLoaded || !canAutoSaveGlobal.current) return;
        if (isFirstGlobalRender.current) {
          isFirstGlobalRender.current = false;
          return;
        }
        persistGlobalDb(questions, simQuestions).catch(err => console.error(err.message));
      }, [questions, simQuestions, isDataLoaded]);

      const isFirstUserRender = useRef(true);
      useEffect(() => {
        if (!isDataLoaded || !canAutoSaveUser.current) return;
        if (isFirstUserRender.current) {
          isFirstUserRender.current = false;
          return;
        }
        persistUserStorage(progress, notes);
      }, [progress, notes, isDataLoaded, currentUser.username]);

      const clearData = async () => {
        try {
          await persistGlobalDb([], []);
          setQuestions([]);
          setSimQuestions([]);
          setProgress({});
          setNotes({});
        } catch (err) {
          alert(err.message);
        }
      };

      const clearProgress = async () => {
        setProgress({});
        setNotes({});
        await persistUserStorage({}, {});
      };

      if (!isDataLoaded) {
        return <div className="min-h-screen bg-slate-950 flex items-center justify-center text-slate-400 p-4 text-center">Carregando Banco Global...</div>;
      }

      return (
        <div className="min-h-screen bg-slate-950 font-sans text-slate-100">
          <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-2 sm:px-4">
              <div className="flex justify-between h-14 sm:h-16 items-center">
                <div className="flex items-center space-x-2 mr-2 sm:mr-4 shrink-0">
                  <div className="bg-blue-600 p-1.5 sm:p-2 rounded-xl shadow-lg shadow-blue-900/40">
                    <Activity className="w-4 h-4 sm:w-5 sm:h-5 text-white" />
                  </div>
                  <span className="font-bold text-lg sm:text-xl text-white tracking-tight hidden md:block">Med<span className="text-blue-400">Flow</span></span>
                </div>
                <div className="flex space-x-1 sm:space-x-2 items-center overflow-x-auto no-scrollbar flex-1 py-1">
                  <TabButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon={<Target />} label="Dashboard" />
                  <TabButton active={activeTab === 'cara'} onClick={() => setActiveTab('cara')} icon={<BarChart3 />} label="A Cara da Prova" />
                  <TabButton active={activeTab === 'uepa'} onClick={() => setActiveTab('uepa')} icon={<Archive />} label="UEPA PROVAS" />
                  <TabButton active={activeTab === 'exams'} onClick={() => setActiveTab('exams')} icon={<BookOpen />} label="Simulados" />
                  <TabButton active={activeTab === 'upload'} onClick={() => setActiveTab('upload')} icon={<Upload />} label="Importar" />
                </div>
                <div className="flex items-center ml-2 sm:ml-4 space-x-2 sm:space-x-3 border-l border-slate-800 pl-2 sm:pl-3 shrink-0">
                  <div className="hidden xl:flex items-center text-xs text-emerald-400 bg-emerald-950/40 px-2.5 py-1 rounded-lg border border-emerald-900/50">
                    <Cloud className="w-3.5 h-3.5 mr-1.5 animate-pulse" /> {syncStatus}
                  </div>

    function DashboardView({ uepaQuestions, simQuestions, progress }) {
      const [dashboardType, setDashboardType] = useState('provas'); 
      const activeQuestions = dashboardType === 'provas' ? uepaQuestions : simQuestions;

      const stats = useMemo(() => {
        const s = { totalAnswered: 0, totalCorrect: 0, areas: {}, wrongSubthemes: {} };
        AREAS.forEach(area => { s.areas[area] = { total: 0, answered: 0, correct: 0 }; });

        activeQuestions.forEach(q => {
          if (q.isAnnulled) return;
          const areaStat = s.areas[q.area] || { total: 0, answered: 0, correct: 0 };
          areaStat.total += 1;

          if (progress[q.id]) {
            s.totalAnswered += 1;
            areaStat.answered += 1;
            const correctOpt = q.options.find(o => o.isCorrect);
            if (correctOpt && progress[q.id] === correctOpt.id) {
              s.totalCorrect += 1;
              areaStat.correct += 1;
            } else {
              const key = `${q.area} > ${q.subtheme || 'Geral'}`;
              s.wrongSubthemes[key] = (s.wrongSubthemes[key] || 0) + 1;
            }
          }
          s.areas[q.area] = areaStat;
        });
        return s;
      }, [activeQuestions, progress]);

      const pieData = [
        { name: 'Acertos', value: stats.totalCorrect, color: '#34d399' },
        { name: 'Erros', value: stats.totalAnswered - stats.totalCorrect, color: '#f87171' }

      const getAreaIcon = (area) => {

          case 'Cirurgia Geral': return <Activity className="w-5 h-5" />;

          title: `Reforço: ${topic}`,

            >
              Dashboard UEPA Provas
            </button>
            <button 
              onClick={() => setDashboardType('simulados')}
              className={`flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${dashboardType === 'simulados' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
            >
              Dashboard Simulados
            </button>
          </div>

          <div className={`bg-gradient-to-r ${dashboardType === 'provas' ? 'from-blue-900 via-indigo-950 to-slate-900 border-blue-800/40' : 'from-indigo-900 via-purple-950 to-slate-900 border-indigo-800/40'} rounded-2xl p-5 sm:p-8 text-white shadow-xl border`}>

            <p className="text-blue-300/80 text-xs sm:text-base">Atualizado dinamicamente de acordo com o seu progresso pessoal de respostas.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
            <div className="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-lg flex flex-col items-center justify-center">
              <h3 className="text-base sm:text-lg font-bold text-slate-200 mb-2">Taxa de Acertos e Erros</h3>
              
              {stats.totalAnswered > 0 ? (
                <div className="h-44 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>

              <div className="text-center mt-3 pt-3 border-t border-slate-800 w-full">

                  {stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0}%
                </span>
                <p className="text-xs text-slate-400 mt-1">Percentual de Acerto ({stats.totalCorrect}/{stats.totalAnswered})</p>

            <div className="md:col-span-2 bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-lg">
              <h3 className="text-base sm:text-lg font-bold text-slate-200 mb-4 sm:mb-6">Desempenho por Grande Área</h3>
              <div className="space-y-4 sm:space-y-5">
                {AREAS.map(area => {
                  const data = stats.areas[area];
                  const pct = data.answered > 0 ? Math.round((data.correct / data.answered) * 100) : 0;
                  return (
                    <div key={area}>
                      <div className="flex justify-between items-center mb-1.5 sm:mb-2 gap-2">
                        <div className="flex items-center font-medium text-slate-300 text-xs sm:text-sm">
                          <span style={{ color: getAreaColor(area) }} className="mr-2 shrink-0">{getAreaIcon(area)}</span>
                          <span>{area}</span>
                        </div>
                        <div className="text-xs sm:text-sm text-slate-400 shrink-0">
                          <span className="font-bold text-white">{data.correct}</span> / {data.answered} 
                          <span className="ml-1.5">({pct}%)</span>
                        </div>
                      </div>
                      <div className="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                        <div className="h-2.5 rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: getAreaColor(area) }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="border p-4 sm:p-6 rounded-2xl bg-blue-950/40 border-blue-900/50">
            <h4 className="font-bold text-base sm:text-lg text-blue-200 mb-3 flex items-center">
              <Lightbulb className="w-5 h-5 mr-2 text-blue-400 shrink-0" /> Recomendações Inteligentes (Baseadas no seu Progresso)
            </h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">
              {recommendationsList.map((rec, i) => (
                <div key={i} className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                  <span className="text-xs font-bold px-2 py-1 bg-amber-500/20 text-amber-300 rounded-lg">{rec.interval}</span>
                  <h5 className="font-bold text-white text-sm mt-2 mb-1">{rec.title}</h5>
                  <p className="text-slate-300 text-xs leading-relaxed">{rec.content}</p>
                </div>
              ))}

          </div>
        </div>
      );
    }

    function CaraDaProvaView({ questions }) {

      const [selectedArea, setSelectedArea] = useState('Todas');

      const groupsList = useMemo(() => {
        const list = Array.from(new Set(questions.map(q => q.groupLabel))).filter(Boolean);
        return ['Todas', ...list.sort()];
      }, [questions]);

      const chartData = useMemo(() => {
        let filtered = questions.filter(q => q.exam === 'UEPA' && !q.isAnnulled);
        if (selectedExamGroup !== 'Todas') {
          filtered = filtered.filter(q => (q.year && q.year.toString() === selectedExamGroup) || q.groupLabel === selectedExamGroup);
        }
        if (selectedArea !== 'Todas') {
          filtered = filtered.filter(q => q.area === selectedArea);
        }

        const totalCount = filtered.length;
        if (totalCount === 0) return [];

        const subthemeMap = {};
        filtered.forEach(q => {
          const st = q.subtheme || 'Geral';
          if (!subthemeMap[st]) {
            subthemeMap[st] = { count: 0, area: q.area };
          }
          subthemeMap[st].count += 1;
        });

        const palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#6366f1', '#14b8a6', '#eab308'];

        return Object.entries(subthemeMap)
          .map(([name, data], idx) => ({
            name,
            count: data.count,
            area: data.area,
            percentage: Number(((data.count / totalCount) * 100).toFixed(1)),
            color: selectedArea !== 'Todas' ? getAreaColor(selectedArea) : (AREA_COLORS[data.area] || palette[idx % palette.length])
          }))
          .sort((a, b) => b.count - a.count)
          .slice(0, 10);

      return (
        <div className="space-y-4 sm:space-y-6 animate-in fade-in duration-500">
          <div className="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl">

                <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center">
                  <BarChart3 className="w-6 h-6 mr-2 text-blue-400 shrink-0" /> A Cara da Prova (Incidência de Subtemas)
                </h2>

              </div>

                <div className="flex items-center space-x-2 flex-1 sm:flex-initial">
                  <span className="text-xs text-slate-400 font-medium shrink-0">Ano:</span>
                  <select 
                    value={selectedExamGroup} 
                    onChange={e => setSelectedExamGroup(e.target.value)}
                    className="w-full px-3 sm:px-4 py-2 border border-slate-700 rounded-xl text-xs sm:text-sm bg-slate-800 text-slate-200 outline-none"
                  >
                    {groupsList.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
                
                <div className="flex items-center space-x-2 flex-1 sm:flex-initial">
                  <span className="text-xs text-slate-400 font-medium shrink-0">Área:</span>
                  <select 
                    value={selectedArea} 
                    onChange={e => setSelectedArea(e.target.value)}
                    className="w-full px-3 sm:px-4 py-2 border border-slate-700 rounded-xl text-xs sm:text-sm bg-slate-800 text-slate-200 outline-none"
                  >
                    <option value="Todas">Todas as Grandes Áreas</option>
                    {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {chartData.length > 0 ? (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 items-center mt-6 pt-6 border-t border-slate-800">
                <div className="lg:col-span-6 h-[300px] sm:h-[420px] w-full flex items-center justify-center">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie
                        data={chartData}
                        cx="50%"
                        cy="50%"
                        outerRadius={110}
                        innerRadius={40}
                        paddingAngle={3}
                        dataKey="count"
                        label={({ percentage }) => `${percentage}%`}
                      >
                        {chartData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={entry.color} stroke="#0f172a" strokeWidth={2} />
                        ))}
                      </Pie>
                      <RechartsTooltip 
                        contentStyle={{ backgroundColor: '#1e293b', borderRadius: '12px', border: 'none', color: '#fff' }}
                        formatter={(value, name, item) => [`${item.payload.count} questão(ões) (${item.payload.percentage}%)`, item.payload.name]}
                      />
                    </PieChart>
                  </ResponsiveContainer>
                </div>

                <div className="lg:col-span-6 space-y-2.5 sm:space-y-3 max-h-[420px] overflow-y-auto pr-1 sm:pr-2 no-scrollbar">
                  <h4 className="text-xs sm:text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Ranking de Assuntos Mais Cobrados</h4>
                  {chartData.map((item, idx) => (
                    <div key={idx} className="flex items-center justify-between p-3 sm:p-3.5 bg-slate-950 rounded-xl border border-slate-800 hover:border-slate-700 transition-all">
                      <div className="flex items-center space-x-3 mr-2 sm:mr-3">

                        <div>

                          <span className="text-[11px] sm:text-xs text-slate-400">{item.area}</span>

    function ExamsView({ questions, progress, setProgress, notes, setNotes, titlePrefix, isUepaView }) {
      const [selectedGroup, setSelectedGroup] = useState('Todos');
      const [selectedArea, setSelectedArea] = useState('Todas');
      const [currentIndex, setCurrentIndex] = useState(0);
      
      const [tempOptionId, setTempOptionId] = useState(null);
      const [eliminated, setEliminated] = useState({});
      
      const [aiExplanation, setAiExplanation] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [noteText, setNoteText] = useState('');

      const groupsList = useMemo(() => {
        const list = Array.from(new Set(questions.map(q => q.groupLabel))).filter(Boolean);
        return ['Todos', ...list.sort()];
      }, [questions]);

      useEffect(() => {
        if (isUepaView && selectedGroup === 'Todos' && groupsList.length > 1) {
          setSelectedGroup(groupsList[1]);
        }
      }, [isUepaView, groupsList, selectedGroup]);

      const currentQuestions = useMemo(() => {
        let filtered = questions;
        if (selectedGroup !== 'Todos') filtered = filtered.filter(q => q.groupLabel === selectedGroup);
        if (selectedArea !== 'Todas') filtered = filtered.filter(q => q.area === selectedArea);
        return filtered;
      }, [questions, selectedGroup, selectedArea]);

      const currentQ = currentQuestions[currentIndex];

      useEffect(() => {
        setTempOptionId(null);
        setEliminated({});
        setAiExplanation('');
        if (currentQ) setNoteText(notes[currentQ.id] || '');
      }, [currentIndex, currentQ, notes]);

      if (!questions.length) {
        return (
          <div className="text-center py-16 sm:py-20 px-4 bg-slate-900 rounded-2xl border border-slate-800">
            <BookOpen className="w-14 h-14 sm:w-16 sm:h-16 text-slate-600 mx-auto mb-4" />
            <h2 className="text-lg sm:text-xl font-bold text-slate-300">Nenhum item disponível no banco base</h2>
            <p className="text-slate-500 mt-2 text-xs sm:text-sm">Vá até a aba "Importar" para cadastrar as questões que aparecerão para todos os usuários.</p>
          </div>
        );
      }

      if (!currentQ && currentQuestions.length === 0) {
        return (
          <div className="text-center py-16 sm:py-20 px-4 bg-slate-900 rounded-2xl border border-slate-800">
            <h2 className="text-lg sm:text-xl font-bold text-slate-300">Nenhuma questão para este filtro</h2>
            <button onClick={() => { setSelectedGroup('Todos'); setSelectedArea('Todas'); }} className="mt-4 text-blue-400 text-sm font-medium">Limpar Filtros</button>
          </div>
        );
      }

      if (!currentQ) return null;

      const isConfirmed = !!progress[currentQ.id];
      const confirmedOptionId = progress[currentQ.id];

      const handleConfirm = () => {
        if (tempOptionId) {
          setProgress({ ...progress, [currentQ.id]: tempOptionId });
        }
      };

      const toggleEliminate = (e, optId) => {
        e.stopPropagation();
        setEliminated(prev => ({ ...prev, [optId]: !prev[optId] }));
      };

      const jumpIndex = (amount) => {
        let newIndex = currentIndex + amount;
        if (newIndex < 0) newIndex = 0;
        if (newIndex >= currentQuestions.length) newIndex = currentQuestions.length - 1;
        setCurrentIndex(newIndex);
      };

      const saveNote = () => {
        setNotes({ ...notes, [currentQ.id]: noteText });
      };

      const getAIExplanation = async () => {
        setAiLoading(true);
        setAiExplanation('');

        const correctOpt = currentQ.options.find(o => o.isCorrect);

        const systemPrompt = "Você é um médico especialista em educação médica e residência médica no Brasil. Forneça uma análise técnica fundamentada nas diretrizes do Ministério da Saúde e guidelines vigentes. Explique detalhadamente o enunciado, por que a alternativa correta é a gabaritada e por que as alternativas incorretas são distratores.";
        const userQuery = `Analise esta questão de prova:\n\nGrande Área: ${currentQ.area}\nSubtema: ${currentQ.subtheme}\nEnunciado: ${currentQ.text}\n\nAlternativas:\n${currentQ.options.map(o => `${o.id}) ${o.text}`).join('\n')}\n\nGabarito: ${correctOpt ? correctOpt.id : 'Anulada'}`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          const candidate = result.candidates?.[0];
          if (candidate && candidate.content?.parts?.[0]?.text) {
            setAiExplanation(candidate.content.parts[0].text);
          } else {
            fallbackExplanation(correctOpt);
          }
        } catch (err) {
          fallbackExplanation(correctOpt);
        } finally {
          setAiLoading(false);
        }
      };

      const fallbackExplanation = (correctOpt) => {
        setAiExplanation(
          `De acordo com as diretrizes do Ministério da Saúde e protocolos vigentes para ${currentQ.area} (${currentQ.subtheme}), a alternativa correta é a letra "${correctOpt ? correctOpt.id : 'N/A'}".\n\n` +
          `Esta conclusão decorre da análise rigorosa do quadro clínico apresentado no enunciado.`
        );
      };

      return (
        <div className="max-w-4xl mx-auto animate-in fade-in duration-300">
          <div className="bg-slate-900 p-3 sm:p-4 rounded-t-2xl border border-slate-800 border-b-0 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 sm:gap-4">
            <div className="flex flex-col sm:flex-row gap-2.5 sm:gap-3 w-full md:w-auto">
              <select 
                value={selectedGroup} 
                onChange={e => { setSelectedGroup(e.target.value); setCurrentIndex(0); }}
                className="w-full sm:w-auto px-3 sm:px-4 py-2.5 border border-slate-700 rounded-xl text-xs sm:text-sm font-medium bg-slate-800 text-slate-200 outline-none"
              >
                <option value="Todos">Todas as Provas</option>
                {groupsList.filter(g => g !== 'Todos').map(g => <option key={g} value={g}>{titlePrefix}: {g}</option>)}
              </select>

              <select 
                value={selectedArea} 
                onChange={e => { setSelectedArea(e.target.value); setCurrentIndex(0); }}
                className="w-full sm:w-auto px-3 sm:px-4 py-2.5 border border-slate-700 rounded-xl text-xs sm:text-sm font-medium bg-slate-800 text-slate-200 outline-none"
              >
                <option value="Todas">Todas as Áreas</option>
                {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>

            <div className="flex items-center justify-between sm:justify-center space-x-1 sm:space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
              <button onClick={() => jumpIndex(-10)} disabled={currentIndex === 0} className="px-2.5 sm:px-3 py-1.5 min-h-[36px] hover:bg-slate-700 rounded-lg text-slate-300 font-bold text-xs sm:text-sm disabled:opacity-30" title="Voltar 10 questões">&lt;&lt;</button>
              <button onClick={() => jumpIndex(-1)} disabled={currentIndex === 0} className="px-2.5 sm:px-3 py-1.5 min-h-[36px] hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-xs sm:text-sm disabled:opacity-30" title="Voltar 1 questão">&lt;</button>
              <span className="px-2 sm:px-3 font-semibold text-xs sm:text-sm text-slate-200 whitespace-nowrap">{currentIndex + 1} / {currentQuestions.length}</span>
              <button onClick={() => jumpIndex(1)} disabled={currentIndex === currentQuestions.length - 1} className="px-2.5 sm:px-3 py-1.5 min-h-[36px] hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-xs sm:text-sm disabled:opacity-30" title="Avançar 1 questão">&gt;</button>
              <button onClick={() => jumpIndex(10)} disabled={currentIndex === currentQuestions.length - 1} className="px-2.5 sm:px-3 py-1.5 min-h-[36px] hover:bg-slate-700 rounded-lg text-slate-300 font-bold text-xs sm:text-sm disabled:opacity-30" title="Avançar 10 questões">&gt;&gt;</button>
            </div>
          </div>

          <div className="bg-slate-900 p-4 sm:p-6 md:p-10 rounded-b-2xl border border-slate-800 shadow-xl relative">
            <div className="min-h-[360px] sm:min-h-[400px]">
              <div className="flex flex-wrap items-center gap-2 sm:gap-3 mb-4 sm:mb-6">
                <span className="px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm" style={{ backgroundColor: getAreaColor(currentQ.area) }}>{currentQ.area}</span>
                <span className="text-slate-400 text-xs sm:text-sm font-medium">{currentQ.subtheme}</span>
                {currentQ.groupLabel && <span className="text-slate-500 text-xs sm:text-sm font-medium border-l border-slate-700 pl-2.5 sm:pl-3">{currentQ.groupLabel}</span>}
              </div>

              <p className="text-base sm:text-lg text-slate-100 leading-relaxed mb-6 sm:mb-8 font-medium whitespace-pre-line">{currentQ.text}</p>

              <div className="space-y-2.5 sm:space-y-3">
                {currentQ.options.map((opt) => {
                  const letter = opt.id;
                  const isEliminated = eliminated[opt.id];
                  let btnClass = "relative w-full text-left p-3.5 sm:p-4 rounded-xl border transition-all flex items-start group ";
                  
                  if (currentQ.isAnnulled) {
                    btnClass += "border-slate-800 bg-slate-950 opacity-50 cursor-not-allowed";
                  } else if (isConfirmed) {
                    if (opt.isCorrect) btnClass += "bg-emerald-950/40 border-emerald-500/80 text-emerald-200";
                    else if (confirmedOptionId === opt.id) btnClass += "bg-red-950/40 border-red-500/80 text-red-200";
                    else btnClass += "border-slate-800 opacity-40 bg-slate-950 text-slate-500";
                  } else {
                    if (isEliminated) btnClass += "border-slate-800 bg-slate-950 text-slate-600";
                    else if (tempOptionId === opt.id) btnClass += "border-blue-500 bg-blue-950/30 text-blue-200 shadow-md";
                    else btnClass += "border-slate-800 bg-slate-800/40 hover:border-blue-500/50 hover:bg-slate-800 text-slate-300";
                  }

                  return (
                    <button
                      key={opt.id}
                      disabled={isConfirmed || currentQ.isAnnulled}
                      onClick={() => !isEliminated && setTempOptionId(opt.id)}
                      className={btnClass}
                    >
                      <div className={`shrink-0 w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold mr-3 sm:mr-4 text-xs sm:text-sm transition-colors ${
                        isConfirmed && opt.isCorrect ? 'bg-emerald-600 text-white' : 
                        isConfirmed && confirmedOptionId === opt.id ? 'bg-red-600 text-white' :
                        tempOptionId === opt.id ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'
                      }`}>
                        {letter}
                      </div>
                      <span className={`flex-1 pt-0.5 sm:pt-1 text-sm sm:text-base ${isEliminated ? 'line-through opacity-50' : ''}`}>{opt.text}</span>
                      {!isConfirmed && !currentQ.isAnnulled && (
                        <div onClick={(e) => toggleEliminate(e, opt.id)} className="shrink-0 ml-2 p-2 min-w-[36px] min-h-[36px] flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-700 hover:text-slate-100" title="Riscar/Descartar alternativa">
                          <Scissors className="w-4 h-4" />
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              <div className="mt-6 sm:mt-8 pt-5 sm:pt-6 border-t border-slate-800 flex justify-between items-center">
                {!isConfirmed && !currentQ.isAnnulled ? (
                  <button 
                    onClick={handleConfirm}
                    disabled={!tempOptionId}
                    className="w-full sm:w-auto sm:ml-auto flex items-center justify-center bg-blue-600 text-white px-5 sm:px-6 py-3 min-h-[44px] rounded-xl font-bold hover:bg-blue-500 disabled:opacity-40 shadow-lg shadow-blue-900/30 text-sm sm:text-base"
                  >
                    <Check className="w-5 h-5 mr-2" /> Confirmar Resposta
                  </button>
                ) : (
                  <div className="w-full space-y-4 animate-in slide-in-from-bottom-2">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-950 p-4 rounded-xl border border-slate-800 gap-3">
                      <div className="flex items-center">
                        {currentQ.isAnnulled ? (
                          <span className="flex items-center text-slate-400 font-bold text-sm sm:text-base"><AlertCircle className="w-5 h-5 mr-2" /> Questão Anulada</span>
                        ) : currentQ.options.find(o => o.id === confirmedOptionId)?.isCorrect ? (
                          <span className="flex items-center text-emerald-400 font-bold text-sm sm:text-base"><Check className="w-5 h-5 mr-2" /> Acertou!</span>
                        ) : (
                          <span className="flex items-center text-red-400 font-bold text-sm sm:text-base"><X className="w-5 h-5 mr-2" /> Errou.</span>
                        )}
                      </div>
                      
                      <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 sm:gap-3">
                        <button 
                          onClick={getAIExplanation}
                          disabled={aiLoading}
                          className="flex items-center justify-center bg-indigo-600 text-white px-4 py-2.5 min-h-[40px] rounded-xl font-medium hover:bg-indigo-500 text-xs sm:text-sm shadow-md disabled:opacity-70"
                        >
                          <Lightbulb className="w-4 h-4 mr-2" /> {aiLoading ? 'Analisando...' : 'Explicar com IA'}
                        </button>
                        <button 
                          onClick={() => jumpIndex(1)}
                          disabled={currentIndex === currentQuestions.length - 1}
                          className="flex items-center justify-center bg-blue-600 text-white px-4 py-2.5 min-h-[40px] rounded-xl font-medium hover:bg-blue-500 text-xs sm:text-sm shadow-md disabled:opacity-40"
                        >
                          Seguinte &gt;
                        </button>
                      </div>
                    </div>

                    {aiExplanation && (
                      <div className="bg-indigo-950/60 border border-indigo-900/60 p-4 sm:p-5 rounded-xl text-indigo-200 text-xs sm:text-sm leading-relaxed animate-in fade-in">
                        <div className="flex items-center font-bold mb-2">
                          <Lightbulb className="w-5 h-5 mr-2 text-indigo-400" /> Explicação Especializada
                        </div>
                        <p className="whitespace-pre-line">{aiExplanation}</p>
                      </div>
                    )}

                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                      <h4 className="text-xs sm:text-sm font-bold text-slate-300 mb-2 flex items-center"><FileText className="w-4 h-4 mr-2" /> Minhas Anotações Pessoais</h4>
                      <textarea
                        value={noteText}
                        onChange={(e) => setNoteText(e.target.value)}
                        placeholder="Escreva suas anotações..."
                        className="w-full min-h-[90px] p-3 text-xs sm:text-sm border border-slate-800 rounded-xl bg-slate-900 text-slate-200 outline-none"
                      />
                      <div className="flex justify-end mt-2">
                        <button onClick={saveNote} className="flex items-center text-xs sm:text-sm font-medium text-blue-400 hover:text-blue-300 py-1 px-2">
                          <Save className="w-4 h-4 mr-1" /> Salvar Anotação
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function UploadView({ questions, setQuestions, simQuestions, setSimQuestions, persistGlobalDb, clearData, clearProgress }) {
      const [bulkText, setBulkText] = useState('');
      const [examYear, setExamYear] = useState('2026');
      const [simName, setSimName] = useState('Simulado Integrado');
      const [simNumber, setSimNumber] = useState('1');
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [saving, setSaving] = useState(false);

      const [deleteYear, setDeleteYear] = useState('2026');
      const [deleteArea, setDeleteArea] = useState('Todas');

      const parseQuestions = (text, defaultExam, defaultYear, isSim = false, groupLabel = '') => {
        const rawLines = text.split('\n');
        const lines = [];
        let currentLine = '';

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i].trim();
          if (!line) continue;
          
          if (!currentLine) {
            currentLine = line;
          } else {
            const partsCount = currentLine.split('|').length;
            if (partsCount < 9) {
              currentLine += ' ' + line;
            } else {
              lines.push(currentLine);
              currentLine = line;
            }
          }
        }
        if (currentLine) lines.push(currentLine);

        return lines.map((line, index) => {
          const parts = line.split('|');
          if (parts.length < 9) {
            throw new Error(`A linha ${index + 1} não possui as 9 colunas exigidas (separadas por '|').`);
          }

          let area = parts[0].trim();
          const areaUpper = area.toUpperCase();
          if (areaUpper.includes('FAMÍLIA') || areaUpper.includes('FAMILIA') || areaUpper === 'MFC' || areaUpper.includes('PREVENTIVA')) {
            area = 'Medicina da Família e Comunidade';
          } else if (areaUpper.includes('CIRURGIA')) {
            area = 'Cirurgia Geral';
          } else if (areaUpper.includes('GINECOLOGIA') || areaUpper === 'GO' || areaUpper.includes('OBSTETR')) {
            area = 'Ginecologia & Obstetrícia';
          } else if (areaUpper.includes('CLÍNICA') || areaUpper.includes('CLINICA')) {
            area = 'Clínica Médica';
          } else if (areaUpper.includes('PEDIATRIA') || areaUpper === 'PED') {
            area = 'Pediatria';
          }

          const subtheme = parts[1].trim();
          const textContent = parts[2].trim();
          const altA = parts[3].trim();
          const altB = parts[4].trim();
          const altC = parts[5].trim();
          const altD = parts[6].trim();
          const altE = parts[7].trim();
          
          const gabarito = parts[8]?.trim() || ''; 
          const gabaritoFormatado = gabarito.toUpperCase();
          const isAnnulled = gabaritoFormatado === 'ANULADA' || gabaritoFormatado === 'NULA' || gabaritoFormatado === '-' || gabaritoFormatado === '';

          const options = [
            { id: 'A', text: altA, isCorrect: gabaritoFormatado === 'A' },
            { id: 'B', text: altB, isCorrect: gabaritoFormatado === 'B' },
            { id: 'C', text: altC, isCorrect: gabaritoFormatado === 'C' },
            { id: 'D', text: altD, isCorrect: gabaritoFormatado === 'D' },
            { id: 'E', text: altE, isCorrect: gabaritoFormatado === 'E' },
          ];

          return {
            id: `q_${isSim ? 'sim' : 'uepa'}_${Date.now()}_${index}`,
            exam: defaultExam,
            year: parseInt(defaultYear) || 2026,
            groupLabel: groupLabel || `${defaultYear}`,
            area,
            subtheme: subtheme || 'Geral',
            text: textContent,
            isAnnulled,
            options
          };
        });
      };

      const handleImportUepa = async () => {
        setErrorMsg('');
        setSuccessMsg('');
        if (!bulkText.trim()) return;
        setSaving(true);
        try {
          const label = examYear.toString();
          const parsed = parseQuestions(bulkText, 'UEPA', examYear, false, label);
          const nextQuestions = [...questions, ...parsed];
          await persistGlobalDb(nextQuestions, simQuestions);
          setQuestions(nextQuestions);
          setBulkText('');
          setSuccessMsg(`${parsed.length} questão(ões) salva(s) no banco global (UEPA).`);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleImportSimulado = async () => {
        setErrorMsg('');
        setSuccessMsg('');
        if (!bulkText.trim()) return;
        setSaving(true);
        try {
          const groupLabel = `${simName} #${simNumber}`;
          const parsed = parseQuestions(bulkText, simName, new Date().getFullYear(), true, groupLabel);
          const nextSimQuestions = [...simQuestions, ...parsed];
          await persistGlobalDb(questions, nextSimQuestions);
          setSimQuestions(nextSimQuestions);
          setBulkText('');
          setSuccessMsg(`${parsed.length} questão(ões) salva(s) no banco global (Simulados).`);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleFilteredDelete = async () => {
        setErrorMsg('');
        setSuccessMsg('');
        setSaving(true);
        try {
          const targetYear = deleteYear.trim();
          const filterFn = (q) => {
            const matchYear = !targetYear || q.year.toString() === targetYear || q.groupLabel?.includes(targetYear);
            const matchArea = deleteArea === 'Todas' || q.area === deleteArea;
            return !(matchYear && matchArea);
          };

          const nextQuestions = questions.filter(filterFn);
          const nextSimQuestions = simQuestions.filter(filterFn);
          await persistGlobalDb(nextQuestions, nextSimQuestions);
          setQuestions(nextQuestions);
          setSimQuestions(nextSimQuestions);
          setSuccessMsg('Filtro aplicado e banco global atualizado.');
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4 sm:space-y-6 animate-in fade-in duration-300">
          <div className="bg-slate-900 p-4 sm:p-8 rounded-2xl border border-slate-800 shadow-xl">
            <div className="flex items-center mb-5 sm:mb-6">
              <div className="bg-indigo-600/20 p-2.5 sm:p-3 rounded-2xl mr-3 sm:mr-4 border border-indigo-500/30 shrink-0">
                <Upload className="w-5 h-5 sm:w-6 sm:h-6 text-indigo-400" />
              </div>
              <div>
                <h2 className="text-xl sm:text-2xl font-bold text-white">Banco de Dados Base (Global e Aberto)</h2>
                <p className="text-slate-400 text-xs sm:text-sm mt-1">Qualquer usuário pode importar questões livremente. Tudo fica salvo imediatamente na nuvem para todos.</p>
              </div>
            </div>

            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 sm:p-6 mb-5 sm:mb-6">
              <p className="text-xs sm:text-sm font-medium text-slate-300 mb-2">Padrão Obrigatório (9 Colunas separadas por Pipe |):</p>
              <code className="block bg-slate-900 p-3 rounded-lg text-slate-300 text-[11px] sm:text-xs font-mono overflow-x-auto border border-slate-800">
                Área | Subtema | Enunciado da questão | Alt A | Alt B | Alt C | Alt D | Alt E | Gabarito (A/B/C/D/E ou Anulada)
              </code>
            </div>

            <textarea 
              className="w-full h-44 sm:h-52 p-3.5 sm:p-4 border border-slate-800 rounded-xl font-mono text-xs sm:text-sm bg-slate-950 text-slate-200 outline-none mb-5 sm:mb-6 resize-y"
              placeholder="Cole as questões usando | como separador..."
              value={bulkText}
              onChange={(e) => setBulkText(e.target.value)}
            />

            {errorMsg && (
              <div className="mb-5 sm:mb-6 p-3 bg-red-950/60 border border-red-900 text-red-300 text-xs sm:text-sm rounded-xl flex items-center">
                <AlertCircle className="w-4 h-4 mr-2 shrink-0" /> {errorMsg}
              </div>
            )}

            {successMsg && (
              <div className="mb-5 sm:mb-6 p-3 bg-emerald-950/60 border border-emerald-900 text-emerald-300 text-xs sm:text-sm rounded-xl flex items-center">
                <Check className="w-4 h-4 mr-2 shrink-0" /> {successMsg}
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 pt-4 border-t border-slate-800">
              <div className="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <h3 className="font-bold text-white mb-3 flex items-center text-xs sm:text-sm">
                    <Archive className="w-4 h-4 mr-2 text-blue-400" /> Destino: UEPA PROVAS (Base)
                  </h3>
                  <div className="mb-4">
                    <label className="block text-xs font-medium text-slate-400 mb-1">Ano da Prova UEPA</label>
                    <input 
                      type="number" 
                      value={examYear}
                      onChange={e => setExamYear(e.target.value)}
                      className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                    />
                  </div>
                </div>
                <button disabled={saving} onClick={handleImportUepa} className="w-full bg-blue-600 text-white font-bold py-2.5 min-h-[42px] rounded-xl hover:bg-blue-500 text-xs sm:text-sm disabled:opacity-50">
                  {saving ? 'Salvando...' : 'Importar para Banco Base UEPA'}
                </button>
              </div>

              <div className="bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <h3 className="font-bold text-white mb-3 flex items-center text-xs sm:text-sm">
                    <BookOpen className="w-4 h-4 mr-2 text-indigo-400" /> Destino: Simulados (Base)
                  </h3>
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Nome</label>
                      <input 
                        type="text" 
                        value={simName}
                        onChange={e => setSimName(e.target.value)}
                        className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Número</label>
                      <input 
                        type="text" 
                        value={simNumber}
                        onChange={e => setSimNumber(e.target.value)}
                        className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                      />
                    </div>
                  </div>
                </div>
                <button disabled={saving} onClick={handleImportSimulado} className="w-full bg-indigo-600 text-white font-bold py-2.5 min-h-[42px] rounded-xl hover:bg-indigo-500 text-xs sm:text-sm disabled:opacity-50">
                  {saving ? 'Salvando...' : 'Importar para Banco Base Simulados'}
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl mt-6 sm:mt-8">
            <h3 className="text-base sm:text-lg font-bold text-slate-200 mb-2">Exclusão de Questões do Banco Base</h3>
            <p className="text-slate-400 text-xs sm:text-sm mb-5 sm:mb-6">Selecione o ano e a grande área desejada para remover itens do banco global compartilhado.</p>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mb-5 sm:mb-6">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">Ano / Prova (Ex: 2026)</label>
                <input 
                  type="text" 
                  value={deleteYear}
                  onChange={e => setDeleteYear(e.target.value)}
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">Grande Área</label>
                <select 
                  value={deleteArea}
                  onChange={e => setDeleteArea(e.target.value)}
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none"
                >
                  <option value="Todas">Todas as Grandes Áreas</option>
                  {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
                </select>
              </div>
            </div>

            <div className="mb-5 sm:mb-6">
              <button 
                disabled={saving}
                onClick={handleFilteredDelete} 
                className="w-full bg-rose-600 text-white font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/30 text-xs sm:text-sm disabled:opacity-50"
              >
                Apagar Questões do Banco Base Correspondentes aos Filtros
              </button>
            </div>

            <div className="flex flex-col sm:flex-row gap-3 sm:gap-4 pt-4 border-t border-slate-800">
              <button onClick={clearProgress} className="flex-1 bg-slate-800 border border-slate-700 text-red-400 font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-slate-700 text-xs sm:text-sm">
                Zerar Meu Progresso Pessoal
              </button>
              <button onClick={clearData} className="flex-1 bg-red-600 text-white font-bold py-3 min-h-[44px] px-4 rounded-xl hover:bg-red-500 text-xs sm:text-sm shadow-lg shadow-red-900/30">
                Apagar Todo o Banco Global
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
