<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedFlow - Plataforma de Estudos Médicos</title>
  
  <!-- Tailwind CSS para estilização (Dark Mode) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Recharts -->
  <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>

  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body {
      background-color: #020617;
      color: #f1f5f9;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    // Configuração Supabase
    const SUPABASE_URL = 'https://naoaeuqotcjzxagllkiz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9KR6IDS7LL12evXMX0cHXw_HojK1e7z';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const RechartsLib = window.Recharts || {};
    const PieChart = RechartsLib.PieChart || (props => <div {...props} />);
    const Pie = RechartsLib.Pie || (props => null);
    const Cell = RechartsLib.Cell || (props => null);
    const ResponsiveContainer = RechartsLib.ResponsiveContainer || (props => <div style={{width: '100%', height: '100%'}} {...props} />);
    const RechartsTooltip = RechartsLib.Tooltip || (props => null);
    const Legend = RechartsLib.Legend || (props => null);
    const BarChart = RechartsLib.BarChart || (props => <div {...props} />);
    const Bar = RechartsLib.Bar || (props => null);
    const XAxis = RechartsLib.XAxis || (props => null);
    const YAxis = RechartsLib.YAxis || (props => null);
    const CartesianGrid = RechartsLib.CartesianGrid || (props => null);

    const LucideIcons = window.lucideReact || {};
    const getIcon = (name, props) => {
      const IconComponent = LucideIcons[name];
      if (IconComponent) return <IconComponent {...props} />;
      return <span {...props}>•</span>;
    };

    const Check = props => getIcon('Check', props);
    const X = props => getIcon('X', props);
    const Scissors = props => getIcon('Scissors', props);
    const ChevronRight = props => getIcon('ChevronRight', props);
    const ChevronLeft = props => getIcon('ChevronLeft', props);
    const ChevronsRight = props => getIcon('ChevronsRight', props);
    const ChevronsLeft = props => getIcon('ChevronsLeft', props);
    const Lightbulb = props => getIcon('Lightbulb', props);
    const AlertCircle = props => getIcon('AlertCircle', props);
    const Save = props => getIcon('Save', props);
    const Upload = props => getIcon('Upload', props);
    const BarChart3 = props => getIcon('BarChart3', props);
    const Target = props => getIcon('Target', props);
    const BookOpen = props => getIcon('BookOpen', props);
    const FileText = props => getIcon('FileText', props);
    const Activity = props => getIcon('Activity', props);
    const Stethoscope = props => getIcon('Stethoscope', props);
    const Baby = props => getIcon('Baby', props);
    const Users = props => getIcon('Users', props);
    const HeartPulse = props => getIcon('HeartPulse', props);
    const Archive = props => getIcon('Archive', props);
    const LogOut = props => getIcon('LogOut', props);
    const Key = props => getIcon('Key', props);
    const User = props => getIcon('User', props);
    const Cloud = props => getIcon('Cloud', props);

    const AREAS = [
      'Medicina da Família e Comunidade', 
      'Clínica Médica', 
      'Cirurgia Geral', 
      'Ginecologia & Obstetrícia', 
      'Pediatria'
    ];

    const AREA_COLORS = {
      'Medicina da Família e Comunidade': '#fbbf24', 
      'Clínica Médica': '#60a5fa', 
      'Cirurgia Geral': '#f87171', 
      'Ginecologia & Obstetrícia': '#a78bfa', 
      'Pediatria': '#34d399', 
      'Geral': '#94a3b8' 
    };

    const getAreaColor = (area) => AREA_COLORS[area] || AREA_COLORS['Geral'];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('medflow_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      const handleLogin = (user) => {
        localStorage.setItem('medflow_current_user', JSON.stringify(user));
        setCurrentUser(user);
      };

      const handleLogout = () => {
        localStorage.removeItem('medflow_current_user');
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <LoginView onLogin={handleLogin} />;
      }

      return <MainApp currentUser={currentUser} onLogout={handleLogout} />;
    }

    function LoginView({ onLogin }) {
      const [isRegistering, setIsRegistering] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        const userTrimmed = username.trim();
        const passTrimmed = password.trim();

        if (!userTrimmed || !passTrimmed) {
          setError('Preencha todos os campos.');
          return;
        }

        const usersStr = localStorage.getItem('medflow_users_db');
        const users = usersStr ? JSON.parse(usersStr) : {};

        if (isRegistering) {
          if (users[userTrimmed]) {
            setError('Este usuário já existe. Faça login.');
            return;
          }
          users[userTrimmed] = { password: passTrimmed };
          localStorage.setItem('medflow_users_db', JSON.stringify(users));
          onLogin({ username: userTrimmed });
        } else {
          if (users[userTrimmed] && users[userTrimmed].password !== passTrimmed) {
            setError('Usuário ou senha incorretos.');
            return;
          }
          if (!users[userTrimmed]) {
            users[userTrimmed] = { password: passTrimmed };
            localStorage.setItem('medflow_users_db', JSON.stringify(users));
          }
          onLogin({ username: userTrimmed });
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
            <div className="flex flex-col items-center mb-8">
              <div className="bg-blue-600 p-4 rounded-2xl shadow-lg shadow-blue-900/40 mb-4">
                <Activity className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-3xl font-bold text-white tracking-tight">Med<span className="text-blue-400">Flow</span></h1>
              <p className="text-slate-400 text-sm mt-2 text-center">Plataforma Inteligente com Backup em Nuvem</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              {error && (
                <div className="p-3 bg-red-950/60 border border-red-900 text-red-300 text-sm rounded-xl flex items-center">
                  <AlertCircle className="w-4 h-4 mr-2 shrink-0" />
                  {error}
                </div>
              )}
              
              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5 ml-1">Usuário</label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full pl-4 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"
                  placeholder="Seu nome de usuário"
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-300 mb-1.5 ml-1">Senha</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full pl-4 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"
                  placeholder="Sua senha"
                />
              </div>

              <button
                type="submit"
                className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition-colors shadow-lg shadow-blue-900/30"
              >
                {isRegistering ? 'Criar Conta e Entrar' : 'Entrar na Plataforma'}
              </button>
            </form>

            <div className="mt-6 text-center">
              <button
                type="button"
                onClick={() => { setIsRegistering(!isRegistering); setError(''); }}
                className="text-slate-400 hover:text-blue-400 text-sm font-medium"
              >
                {isRegistering ? 'Já tem uma conta? Faça login' : 'Não tem conta? Cadastre-se'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function MainApp({ currentUser, onLogout }) {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Sincronizado');
      
      const [questions, setQuestions] = useState([]);
      const [simQuestions, setSimQuestions] = useState([]);
      const [progress, setProgress] = useState({});
      const [notes, setNotes] = useState({});

      useEffect(() => {
        async function loadData() {
          try {
            if (supabaseClient) {
              try {
                // Carrega banco de dados global (questões e simulados)
                const { data: cloudData } = await supabaseClient
                  .from('medflow_cloud_storage')
                  .select('*')
                  .eq('key', 'global_db')
                  .single();
                
                if (cloudData && cloudData.value) {
                  if (cloudData.value.questions) setQuestions(cloudData.value.questions);
                  if (cloudData.value.simQuestions) setSimQuestions(cloudData.value.simQuestions);
                }

                // Carrega progresso global do usuário logado na nuvem
                const { data: userCloud } = await supabaseClient
                  .from('medflow_cloud_storage')
                  .select('*')
                  .eq('key', `user_global_${currentUser.username}`)
                  .single();

                if (userCloud && userCloud.value) {
                  if (userCloud.value.progress) setProgress(userCloud.value.progress);
                  if (userCloud.value.notes) setNotes(userCloud.value.notes);
                }
              } catch (e) {
                console.log("Modo offline ou tabela em nuvem pendente, usando cache local.");
              }
            }

            // Fallback / Cache local para garantir velocidade e redundância
            const q = localStorage.getItem('medflow_questions_shared_v12');
            if (q && questions.length === 0) setQuestions(JSON.parse(q));
            
            const sq = localStorage.getItem('medflow_sim_questions_shared_v12');
            if (sq && simQuestions.length === 0) setSimQuestions(JSON.parse(sq));

            const p = localStorage.getItem(`medflow_progress_global_${currentUser.username}`);
            if (p && Object.keys(progress).length === 0) setProgress(JSON.parse(p));

            const n = localStorage.getItem(`medflow_notes_global_${currentUser.username}`);
            if (n && Object.keys(notes).length === 0) setNotes(JSON.parse(n));

          } catch (e) {
            console.error("Erro ao carregar dados", e);
          } finally {
            setIsDataLoaded(true);
          }
        }
        loadData();
      }, [currentUser.username]);

      useEffect(() => {
        if (!isDataLoaded) return;
        try {
          // Atualiza cache local
          localStorage.setItem('medflow_questions_shared_v12', JSON.stringify(questions));
          localStorage.setItem('medflow_sim_questions_shared_v12', JSON.stringify(simQuestions));
          localStorage.setItem(`medflow_progress_global_${currentUser.username}`, JSON.stringify(progress));
          localStorage.setItem(`medflow_notes_global_${currentUser.username}`, JSON.stringify(notes));

          // Salva globalmente no Supabase para sincronização em nuvem
          if (supabaseClient) {
            setSyncStatus('Sincronizando...');
            supabaseClient
              .from('medflow_cloud_storage')
              .upsert([
                { key: 'global_db', value: { questions, simQuestions }, updated_at: new Date() },
                { key: `user_global_${currentUser.username}`, value: { progress, notes }, updated_at: new Date() }
              ], { onConflict: 'key' })
              .then(({ error }) => {
                if (!error) setSyncStatus('Sincronizado na Nuvem');
                else setSyncStatus('Modo Local Ativo');
              })
              .catch(() => setSyncStatus('Modo Local Ativo'));
          }
        } catch (e) {
          console.error("Erro ao salvar dados", e);
        }
      }, [questions, simQuestions, progress, notes, isDataLoaded, currentUser.username]);

      const clearData = () => {
        const password = window.prompt("AÇÃO RESTRITA: Digite a senha de administrador para apagar o banco de dados global.");
        if (password === "admin") {
          if (window.confirm('Tem certeza ABSOLUTA? Todas as provas e simulados globais serão apagados.')) {
            setQuestions([]);
            setSimQuestions([]);
            setProgress({});
            setNotes({});
            alert("Banco de dados apagado com sucesso.");
          }
        } else if (password !== null) {
          alert("Senha incorreta.");
        }
      };

      const clearProgress = () => {
        if (window.confirm('Deseja zerar apenas o seu progresso pessoal?')) {
          setProgress({});
          setNotes({});
        }
      };

      if (!isDataLoaded) {
        return <div className="min-h-screen bg-slate-950 flex items-center justify-center text-slate-400">Carregando dados salvos...</div>;
      }

      return (
        <div className="min-h-screen bg-slate-950 font-sans text-slate-100">
          <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-4">
              <div className="flex justify-between h-16">
                <div className="flex items-center space-x-2 mr-4">
                  <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-900/40">
                    <Activity className="w-5 h-5 text-white" />
                  </div>
                  <span className="font-bold text-xl text-white tracking-tight hidden sm:block">Med<span className="text-blue-400">Flow</span></span>
                </div>
                <div className="flex space-x-1 sm:space-x-2 items-center overflow-x-auto no-scrollbar flex-1">
                  <TabButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon={<Target />} label="Dashboard" />
                  <TabButton active={activeTab === 'cara'} onClick={() => setActiveTab('cara')} icon={<BarChart3 />} label="A Cara da Prova" />
                  <TabButton active={activeTab === 'uepa'} onClick={() => setActiveTab('uepa')} icon={<Archive />} label="UEPA PROVAS" />
                  <TabButton active={activeTab === 'exams'} onClick={() => setActiveTab('exams')} icon={<BookOpen />} label="Simulados" />
                  <TabButton active={activeTab === 'upload'} onClick={() => setActiveTab('upload')} icon={<Upload />} label="Importar" />
                </div>
                <div className="flex items-center ml-4 space-x-3 border-l border-slate-800 pl-3">
                  <div className="hidden lg:flex items-center text-xs text-emerald-400 bg-emerald-950/40 px-2.5 py-1 rounded-lg border border-emerald-900/50">
                    <Cloud className="w-3.5 h-3.5 mr-1.5 animate-pulse" /> {syncStatus}
                  </div>
                  <div className="hidden md:flex flex-col text-right">
                    <span className="text-xs text-slate-500 font-medium">Logado</span>
                    <span className="text-sm font-bold text-slate-200">{currentUser.username}</span>
                  </div>
                  <button onClick={onLogout} className="p-2 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-xl" title="Sair">
                    <LogOut className="w-4 h-4" />
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-6xl mx-auto px-4 py-8">
            {activeTab === 'dashboard' && <DashboardView uepaQuestions={questions} simQuestions={simQuestions} progress={progress} />}
            {activeTab === 'cara' && <CaraDaProvaView questions={questions} />}
            {activeTab === 'uepa' && <ExamsView questions={questions} progress={progress} setProgress={setProgress} notes={notes} setNotes={setNotes} titlePrefix="UEPA" isUepaView={true} />}
            {activeTab === 'exams' && <ExamsView questions={simQuestions} progress={progress} setProgress={setProgress} notes={notes} setNotes={setNotes} titlePrefix="Simulado" isUepaView={false} />}
            {activeTab === 'upload' && <UploadView questions={questions} setQuestions={setQuestions} simQuestions={simQuestions} setSimQuestions={setSimQuestions} clearData={clearData} clearProgress={clearProgress} />}
          </main>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center px-3 py-2 rounded-xl text-sm font-medium transition-all whitespace-nowrap
            ${active ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
        >
          {React.cloneElement(icon, { className: 'w-4 h-4 sm:mr-2' })}
          <span className="hidden sm:inline">{label}</span>
        </button>
      );
    }

    function DashboardView({ uepaQuestions, simQuestions, progress }) {
      const [dashboardType, setDashboardType] = useState('provas'); 
      const activeQuestions = dashboardType === 'provas' ? uepaQuestions : simQuestions;

      const stats = useMemo(() => {
        const s = { totalAnswered: 0, totalCorrect: 0, areas: {}, wrongSubthemes: {} };
        AREAS.forEach(area => { s.areas[area] = { total: 0, answered: 0, correct: 0 }; });

        activeQuestions.forEach(q => {
          if (q.isAnnulled) return;
          const areaStat = s.areas[q.area] || { total: 0, answered: 0, correct: 0 };
          areaStat.total += 1;

          if (progress[q.id]) {
            s.totalAnswered += 1;
            areaStat.answered += 1;
            const correctOpt = q.options.find(o => o.isCorrect);
            if (correctOpt && progress[q.id] === correctOpt.id) {
              s.totalCorrect += 1;
              areaStat.correct += 1;
            } else {
              const key = `${q.area} > ${q.subtheme || 'Geral'}`;
              s.wrongSubthemes[key] = (s.wrongSubthemes[key] || 0) + 1;
            }
          }
          s.areas[q.area] = areaStat;
        });
        return s;
      }, [activeQuestions, progress]);

      const pieData = [
        { name: 'Acertos', value: stats.totalCorrect, color: '#34d399' },
        { name: 'Erros', value: stats.totalAnswered - stats.totalCorrect, color: '#f87171' }
      ];

      const getAreaIcon = (area) => {
        switch (area) {
          case 'Medicina da Família e Comunidade': return <Users className="w-5 h-5" />;
          case 'Clínica Médica': return <Stethoscope className="w-5 h-5" />;
          case 'Cirurgia Geral': return <Activity className="w-5 h-5" />;
          case 'Ginecologia & Obstetrícia': return <HeartPulse className="w-5 h-5" />;
          case 'Pediatria': return <Baby className="w-5 h-5" />;
          default: return <FileText className="w-5 h-5" />;
        }
      };

      const recommendationsList = useMemo(() => {
        const sortedErrors = Object.entries(stats.wrongSubthemes).sort((a, b) => b[1] - a[1]);
        if (sortedErrors.length === 0) {
          return [{
            title: "Nenhum erro registrado",
            interval: "Revisão Geral (Hoje)",
            content: "Responda mais questões para ativar o plano de estudo baseado em repetição espaçada."
          }];
        }
        return sortedErrors.slice(0, 3).map(([topic, count]) => ({
          title: `Reforço: ${topic}`,
          interval: count >= 3 ? "Alta Prioridade" : "Revisão em 3 dias",
          content: `Você errou este subtema ${count} vez(es). Revise os guidelines do Ministério da Saúde para fixar a conduta correta.`
        }));
      }, [stats.wrongSubthemes]);

      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="flex bg-slate-900 p-1.5 rounded-2xl w-full sm:w-fit border border-slate-800">
            <button 
              onClick={() => setDashboardType('provas')}
              className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold ${dashboardType === 'provas' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
            >
              Dashboard UEPA Provas
            </button>
            <button 
              onClick={() => setDashboardType('simulados')}
              className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold ${dashboardType === 'simulados' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
            >
              Dashboard Simulados
            </button>
          </div>

          <div className={`bg-gradient-to-r ${dashboardType === 'provas' ? 'from-blue-900 via-indigo-950 to-slate-900 border-blue-800/40' : 'from-indigo-900 via-purple-950 to-slate-900 border-indigo-800/40'} rounded-2xl p-8 text-white shadow-xl border`}>
            <h1 className="text-3xl font-bold mb-2">
              {dashboardType === 'provas' ? 'Painel de Desempenho: UEPA' : 'Painel de Desempenho: Simulados'}
            </h1>
            <p className="text-blue-300/80">Estatísticas sincronizadas permanentemente em nuvem e salvamento local.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg flex flex-col items-center justify-center">
              <h3 className="text-lg font-bold text-slate-200 mb-2">Taxa de Acertos e Erros</h3>
              
              {stats.totalAnswered > 0 ? (
                <div className="h-44 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie
                        data={pieData}
                        innerRadius={50}
                        outerRadius={70}
                        paddingAngle={5}
                        dataKey="value"
                      >
                        {pieData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={entry.color} />
                        ))}
                      </Pie>
                      <RechartsTooltip contentStyle={{ backgroundColor: '#1e293b', border: 'none', borderRadius: '12px', color: '#fff' }} />
                      <Legend verticalAlign="bottom" height={30} wrapperStyle={{ color: '#94a3b8', fontSize: '12px' }}/>
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              ) : (
                <div className="h-36 flex items-center justify-center text-slate-500 text-sm">
                  Nenhuma questão respondida.
                </div>
              )}

              <div className="text-center mt-3 pt-3 border-t border-slate-800 w-full">
                <span className="text-3xl font-bold text-white">
                  {stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0}%
                </span>
                <p className="text-xs text-slate-400 mt-1">Percentual de Acerto ({stats.totalCorrect}/{stats.totalAnswered})</p>
              </div>
            </div>

            <div className="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
              <h3 className="text-lg font-bold text-slate-200 mb-6">Desempenho por Grande Área</h3>
              <div className="space-y-5">
                {AREAS.map(area => {
                  const data = stats.areas[area];
                  const pct = data.answered > 0 ? Math.round((data.correct / data.answered) * 100) : 0;
                  return (
                    <div key={area}>
                      <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center font-medium text-slate-300">

    function UploadView({ questions, setQuestions, simQuestions, setSimQuestions, clearData, clearProgress }) {
      const [bulkText, setBulkText] = useState('');
      const [examYear, setExamYear] = useState('2026');
      const [simName, setSimName] = useState('Simulado Integrado');
      const [simNumber, setSimNumber] = useState('1');
      const [errorMsg, setErrorMsg] = useState('');

      const [deleteYear, setDeleteYear] = useState('2026');
      const [deleteArea, setDeleteArea] = useState('Todas');

      const parseQuestions = (text, defaultExam, defaultYear, isSim = false, groupLabel = '') => {
        const rawLines = text.split('\n');
        const lines = [];
        let currentLine = '';

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i].trim();
          if (!line) continue;
          
          if (!currentLine) {
            currentLine = line;
          } else {
            const partsCount = currentLine.split('|').length;
            if (partsCount < 9) {
              currentLine += ' ' + line;
            } else {
              lines.push(currentLine);
              currentLine = line;
            }
          }
        }
        if (currentLine) lines.push(currentLine);

        return lines.map((line, index) => {
          const parts = line.split('|');
          if (parts.length < 9) {
            throw new Error(`A linha ${index + 1} não possui as 9 colunas exigidas (separadas por '|').`);
          }

          let area = parts[0].trim();
          const areaUpper = area.toUpperCase();
          if (areaUpper.includes('FAMÍLIA') || areaUpper.includes('FAMILIA') || areaUpper === 'MFC' || areaUpper.includes('PREVENTIVA')) {
            area = 'Medicina da Família e Comunidade';
          } else if (areaUpper.includes('CIRURGIA')) {
            area = 'Cirurgia Geral';
          } else if (areaUpper.includes('GINECOLOGIA') || areaUpper === 'GO' || areaUpper.includes('OBSTETR')) {
            area = 'Ginecologia & Obstetrícia';
          } else if (areaUpper.includes('CLÍNICA') || areaUpper.includes('CLINICA')) {
            area = 'Clínica Médica';
          } else if (areaUpper.includes('PEDIATRIA') || areaUpper === 'PED') {
            area = 'Pediatria';
          }

          const subtheme = parts[1].trim();
          const textContent = parts[2].trim();
          const altA = parts[3].trim();
          const altB = parts[4].trim();
          const altC = parts[5].trim();
          const altD = parts[6].trim();
          const altE = parts[7].trim();
          
          const gabarito = parts[8]?.trim() || ''; 
          const gabaritoFormatado = gabarito.toUpperCase();
          const isAnnulled = gabaritoFormatado === 'ANULADA' || gabaritoFormatado === 'NULA' || gabaritoFormatado === '-' || gabaritoFormatado === '';

          const options = [
            { id: 'A', text: altA, isCorrect: gabaritoFormatado === 'A' },
            { id: 'B', text: altB, isCorrect: gabaritoFormatado === 'B' },
            { id: 'C', text: altC, isCorrect: gabaritoFormatado === 'C' },
            { id: 'D', text: altD, isCorrect: gabaritoFormatado === 'D' },
            { id: 'E', text: altE, isCorrect: gabaritoFormatado === 'E' },
          ];

          return {
            id: `q_${isSim ? 'sim' : 'uepa'}_${Date.now()}_${index}`,
            exam: defaultExam,
            year: parseInt(defaultYear) || 2026,
            groupLabel: groupLabel || `${defaultYear}`,
            area,
            subtheme: subtheme || 'Geral',
            text: textContent,
            isAnnulled,
            options
          };
        });
      };

      const handleImportUepa = () => {
        setErrorMsg('');
        if (!bulkText.trim()) return;
        try {
          const label = examYear.toString();
          const parsed = parseQuestions(bulkText, 'UEPA', examYear, false, label);
          setQuestions([...questions, ...parsed]);
          setBulkText('');
          alert(`${parsed.length} questões importadas com sucesso para UEPA PROVAS!`);
        } catch (err) {
          setErrorMsg(err.message);
        }
      };

      const handleImportSimulado = () => {
        setErrorMsg('');
        if (!bulkText.trim()) return;
        try {
          const groupLabel = `${simName} #${simNumber}`;
          const parsed = parseQuestions(bulkText, simName, new Date().getFullYear(), true, groupLabel);
          setSimQuestions([...simQuestions, ...parsed]);
          setBulkText('');
          alert(`${parsed.length} questões importadas com sucesso para Simulados!`);
        } catch (err) {
          setErrorMsg(err.message);
        }
      };

      const handleFilteredDelete = () => {
        const password = window.prompt("AÇÃO RESTRITA: Digite a senha de administrador para confirmar a exclusão com base nos filtros selecionados.");
        if (password === "admin") {
          const targetYear = deleteYear.trim();
          
          if (window.confirm(`Tem certeza que deseja apagar as questões do Ano/Grupo "${targetYear}" e Área "${deleteArea}"?`)) {
            const filterFn = (q) => {
              const matchYear = !targetYear || q.year.toString() === targetYear || q.groupLabel?.includes(targetYear);
              const matchArea = deleteArea === 'Todas' || q.area === deleteArea;
              return !(matchYear && matchArea);
            };

            setQuestions(questions.filter(filterFn));
            setSimQuestions(simQuestions.filter(filterFn));
            alert("Exclusão realizada com sucesso.");
          }
        } else if (password !== null) {
          alert("Senha incorreta.");
        }
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 animate-in fade-in duration-300">
          <div className="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl">
            <div className="flex items-center mb-6">
              <div className="bg-indigo-600/20 p-3 rounded-2xl mr-4 border border-indigo-500/30">
                <Upload className="w-6 h-6 text-indigo-400" />
              </div>
              <div>
                <h2 className="text-2xl font-bold text-white">Central de Importação em Nuvem</h2>
                <p className="text-slate-400 text-sm mt-1">Os dados importados são salvos permanentemente e protegidos contra atualizações de código.</p>
              </div>
            </div>

            <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 mb-6">
              <p className="text-sm font-medium text-slate-300 mb-2">Padrão Obrigatório (9 Colunas separadas por Pipe |):</p>
              <code className="block bg-slate-900 p-3 rounded-lg text-slate-300 text-xs font-mono overflow-x-auto border border-slate-800">
                Área | Subtema | Enunciado da questão | Alt A | Alt B | Alt C | Alt D | Alt E | Gabarito (A/B/C/D/E ou Anulada)
              </code>
            </div>

            <textarea 
              className="w-full h-52 p-4 border border-slate-800 rounded-xl font-mono text-sm bg-slate-950 text-slate-200 outline-none mb-6 resize-y"
              placeholder="Cole as questões usando | como separador..."
              value={bulkText}
              onChange={(e) => setBulkText(e.target.value)}
            />

            {errorMsg && (
              <div className="mb-6 p-3 bg-red-950/60 border border-red-900 text-red-300 text-sm rounded-xl flex items-center">
                <AlertCircle className="w-4 h-4 mr-2 shrink-0" /> {errorMsg}
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
              <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <h3 className="font-bold text-white mb-3 flex items-center text-sm">
                    <Archive className="w-4 h-4 mr-2 text-blue-400" /> Destino: UEPA PROVAS
                  </h3>
                  <div className="mb-4">
                    <label className="block text-xs font-medium text-slate-400 mb-1">Ano da Prova UEPA</label>
                    <input 
                      type="number" 
                      value={examYear}
                      onChange={e => setExamYear(e.target.value)}
                      className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                    />
                  </div>
                </div>
                <button onClick={handleImportUepa} className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-500 text-sm">
                  Importar para UEPA
                </button>
              </div>

              <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <h3 className="font-bold text-white mb-3 flex items-center text-sm">
                    <BookOpen className="w-4 h-4 mr-2 text-indigo-400" /> Destino: Simulados
                  </h3>
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Nome</label>
                      <input 
                        type="text" 
                        value={simName}
                        onChange={e => setSimName(e.target.value)}
                        className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Número</label>
                      <input 
                        type="text" 
                        value={simNumber}
                        onChange={e => setSimNumber(e.target.value)}
                        className="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-200 outline-none"
                      />
                    </div>
                  </div>
                </div>
                <button onClick={handleImportSimulado} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-500 text-sm">
                  Importar para Simulados
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mt-8">
            <h3 className="text-lg font-bold text-slate-200 mb-2">Exclusão de Questões por Filtros</h3>
            <p className="text-slate-400 text-sm mb-6">Selecione o ano e a grande área desejada para remover itens específicos do banco global.</p>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">Ano / Prova (Ex: 2026)</label>
                <input 
                  type="text" 
                  value={deleteYear}
                  onChange={e => setDeleteYear(e.target.value)}
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1.5">Grande Área</label>
                <select 
                  value={deleteArea}
                  onChange={e => setDeleteArea(e.target.value)}
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 outline-none"
                >
                  <option value="Todas">Todas as Grandes Áreas</option>
                  {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
                </select>
              </div>
            </div>

            <div className="mb-6">
              <button 
                onClick={handleFilteredDelete} 
                className="w-full bg-rose-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/30 text-sm"
              >
                Apagar Questões Correspondentes aos Filtros Acima
              </button>
            </div>

            <div className="flex flex-col sm:flex-row gap-4 pt-4 border-t border-slate-800">
              <button onClick={clearProgress} className="flex-1 bg-slate-800 border border-slate-700 text-red-400 font-bold py-3 px-4 rounded-xl hover:bg-slate-700 text-sm">
                Zerar Meu Progresso Pessoal
              </button>
              <button onClick={clearData} className="flex-1 bg-red-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-red-500 text-sm shadow-lg shadow-red-900/30">
                Apagar Todo o Banco Global (Requer Senha)
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
